import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.intellij.platform.gradle.models.ProductRelease

plugins {
    id 'org.jetbrains.intellij.platform' version '2.16.0'
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.grammarkit' version '2023.3.0.3'
    id 'idea'
}

group = 'com.mdrobnak'
version = '0.2.17'

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'io.sentry:sentry:8.41.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.0'

    intellijPlatform {
        // Test with a recent EAP or release
        clion("2026.1.2")
        plugin 'com.jetbrains.rust:261.24374.182'

        pluginVerifier()
    }
}

// Add the generated source files into the build
sourceSets.main.java.srcDirs 'src/main/gen'
idea.module.generatedSourceDirs.add(file('src/main/gen'))

generateLexer {
    sourceFile = file("src/main/grammars/LalrpopLexer.flex")
    targetOutputDir = file("src/main/gen/com/mdrobnak/lalrpop/lexer")
    targetClass = "LalrpopLexer"
    purgeOldFiles = true
}

generateParser {
    sourceFile = file("src/main/grammars/LalrpopParser.bnf")
    targetRootOutputDir = file("src/main/gen/")
    pathToParser = "/com/mdrobnak/lalrpop/parser/LalrpopParser.java"
    pathToPsiRoot = "/com/mdrobnak/lalrpop/psi"
    purgeOldFiles = true
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellijPlatform {
    // This is really flaky and we probably don't need it
    buildSearchableOptions = false

    pluginConfiguration {
        ideaVersion {
            // Support 2025.2 up to 2026.1 IDEs
            // 2025.1 Rust plugin has a broken TypeRenderable class
            sinceBuild = "252"
            untilBuild = "261.*"
        }
    }

    publishing {
        token = System.getenv("ORG_GRADLE_PROJECT_intellijPublishToken")
    }

    pluginVerification {
        ides {
            select {
                it.types = [
                    IntelliJPlatformType.RustRover,
                    IntelliJPlatformType.CLion,
                    IntelliJPlatformType.IntellijIdeaUltimate
                ]
                it.sinceBuild = "252"
                it.untilBuild = "261.*"
                it.channels = [ProductRelease.Channel.RELEASE, ProductRelease.Channel.EAP]
            }
        }
    }
}

kotlin {
    jvmToolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

compileKotlin {
    dependsOn(generateLexer, generateParser)
}

test {
    useJUnitPlatform()

    maxHeapSize = "1G"
}